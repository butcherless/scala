name: Scala CI

on:
  push:
    paths-ignore:
      - '**.md'
      - '**.adoc'
      - '**.puml'
      - '**.graphml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  build:

    runs-on: ubuntu-26.04
    timeout-minutes: 10

    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
    - name: Setup JDK
      uses: actions/setup-java@v6
      with:
        distribution: 'zulu'
        java-version: '21'
        cache: sbt
    - uses: sbt/setup-sbt@v1
    # Each `sbt` call is sbt 2's thin client, so every step reuses one sbt server instead of
    # starting a new JVM. Build settings carry over between steps, so assembly runs before coverage.
    - name: compile main
      run: sbt compile
    - name: compile unit tests
      run: sbt Test/compile
    - name: formatting
      run: sbt scalafmtCheckAll
    - name: tests
      run: sbt testFull
    - name: assembly
      run: sbt assembly
    - name: coverage
      run: sbt xcoverage
    - name: dependencies
      run: sbt "dependencyTree;dependencyUpdates"

  project-template:
    runs-on: ubuntu-26.04
    timeout-minutes: 5

    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
    - name: Setup JDK
      uses: actions/setup-java@v6
      with:
        distribution: 'zulu'
        java-version: '21'
        cache: sbt
    - uses: sbt/setup-sbt@v1
    - name: create project template
      run: chmod u+x create-simple-project.sh && ./create-simple-project.sh
      working-directory: docs
