name: Scala CI

on:
  push:
    paths-ignore:
      - '**.md'
      - '**.adoc'
      - '**.puml'
      - '**.graphml'

jobs:

  scala2:

    runs-on: ubuntu-26.04
    timeout-minutes: 10

    steps:
    - uses: actions/checkout@v7
    - name: Setup JDK
      uses: actions/setup-java@v6
      with:
        distribution: 'zulu'
        java-version: '21'
        cache: sbt
    - uses: sbt/setup-sbt@v1
    # Each step reuses one sbt server through sbt 2's thin client, instead of starting a new JVM.
    # That also means build settings carry over between steps, so assembly runs before coverage.
    - name: compile main
      run: sbt compile
      working-directory: ${{env.WORK_DIR}}
    - name: compile unit tests
      run: sbt Test/compile
      working-directory: ${{env.WORK_DIR}}
    - name: formatting
      run: sbt scalafmtCheckAll
      working-directory: ${{env.WORK_DIR}}
    - name: tests
      run: sbt testFull
      working-directory: ${{env.WORK_DIR}}
    - name: assembly
      run: sbt assembly
      working-directory: ${{env.WORK_DIR}}
    - name: coverage
      run: sbt xcoverage
      working-directory: ${{env.WORK_DIR}}
    - name: dependencies
      run: sbt "dependencyTree;dependencyUpdates"
      working-directory: ${{env.WORK_DIR}}

  project-template:
    runs-on: ubuntu-26.04
    timeout-minutes: 5

    steps:
    - uses: actions/checkout@v7
    - name: Setup JDK
      uses: actions/setup-java@v6
      with:
        distribution: 'zulu'
        java-version: '21'
        cache: sbt
    - uses: sbt/setup-sbt@v1
    - name: create project template
      run: chmod u+x create-simple-project.sh && ./create-simple-project.sh
      working-directory: docs
